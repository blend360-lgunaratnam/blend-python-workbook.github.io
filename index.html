  /* Palette pulled from blend360.com's own visual identity: near-black &
     deep navy grounds, an electric-cyan signal color, bold geometric display
     type over a humanist body face, and fully-rounded pill controls. This
     workbook commits to Blend's dark world by default — a warm cream surface
     is still available if the viewer explicitly switches to light. */
  :root{
    --paper:#07080a;
    --paper-raised:#12151c;
    --ink:#f2f5f4;
    --ink-soft:#98a3a8;
    --line:#242b34;
    --navy:#0b1830;
    --accent:#1df4f4;         /* Blend's electric cyan */
    --accent-ink:#00282a;
    --accent-cyan:#1df4f4;
    --code-bg:#000000;
    --code-ink:#e7f7f6;
    --code-line:#1b2430;
    --code-accent:#1df4f4;    /* code islands stay dark always in either theme */
    --code-accent-ink:#00282a;
    --editor-bg:#fdfdfb;      /* the code editor itself is always a light-mode editor, in either page theme */
    --editor-header-bg:#f2f4f6;
    --editor-header-ink:#5b6472;
    --editor-ink:#1c2128;
    --editor-line:#e2e5ea;
    --ok:#5be3ab;
    --err:#ff8f77;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.6);
  }
  /* Deliberately dark-only: no light-theme override, so the page stays dark
     even when the viewer's app is in light mode or a saved copy carries a
     data-theme="light" stamp. */
  :root{ color-scheme:dark; }

  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Lato', system-ui, sans-serif;
    padding-inline:0;
    min-height:100%;
  }
  html,body{height:100%;}

  h1,h2,h3{font-family:'Instrument Sans', system-ui, sans-serif; font-weight:700; text-wrap:balance; margin:0;}
  code, .mono, pre, textarea.cell-input{font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;}

  a{color:var(--accent-cyan);}

  /* ---- app shell ---- */
  #app{display:flex; flex-direction:column; min-height:100vh; max-width:1180px; margin:0 auto;}
  #shell{display:flex; flex-direction:column; width:100%;}
  #shell2{display:flex; flex:1; min-width:0;}

  #topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    display:flex; align-items:center; gap:12px;
    padding:14px 20px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:var(--paper); border-bottom:1px solid var(--line);
  }
  #topbar h1{font-size:1.05rem; font-weight:700; letter-spacing:-.01em; display:flex; align-items:center; gap:10px;}
  #topbar .brand-mark{color:var(--ink); width:34px; height:19px; flex:none;}
  #topbar .prompt{color:var(--accent-cyan); font-family:'JetBrains Mono',monospace; font-weight:600;}
  .status-pill{
    margin-left:auto; display:flex; align-items:center; gap:6px;
    font-size:.72rem; font-family:'JetBrains Mono',monospace; letter-spacing:.02em;
    padding:5px 12px; border-radius:100px; border:1px solid var(--line); color:var(--ink-soft);
    white-space:nowrap;
  }
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-soft); flex:none;}
  .status-pill.ready .status-dot{background:var(--ok);}
  .status-pill.loading .status-dot{background:var(--accent-cyan); animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  #shell{display:flex; flex:1; min-width:0;}

  /* ---- nav ---- */
  #nav{
    width:250px; flex:none; padding:20px 12px 40px;
    border-right:1px solid var(--line);
  }
  #nav ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
  #nav button{
    all:unset; cursor:pointer; display:flex; align-items:baseline; gap:9px;
    padding:8px 12px; border-radius:100px; font-size:.86rem; color:var(--ink-soft);
    width:100%;
  }
  #nav button:hover{background:var(--paper-raised);}
  #nav button .num{font-family:'JetBrains Mono',monospace; font-size:.72rem; color:var(--ink-soft); flex:none; width:1.4em;}
  #nav button.active{background:var(--ink); color:var(--paper); font-weight:700; box-shadow:var(--shadow);}
  #nav button.active .num{color:var(--accent);}
  #nav button .check{margin-left:auto; color:var(--ok); font-size:.8rem; visibility:hidden;}
  #nav button.active .check{color:#5be3ab;}
  #nav button.done .check{visibility:visible;}
  #nav select{display:none;}

  /* ---- main ---- */
  main{flex:1; min-width:0; padding:28px 28px 80px;}
  section.topic{display:none; max-width:760px;}
  section.topic.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .eyebrow{
    display:inline-flex; font-family:'JetBrains Mono',monospace; font-size:.7rem; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-soft); border:1px solid var(--line); border-radius:100px;
    padding:4px 12px;
  }
  section.topic h2{font-size:2.1rem; font-weight:700; margin-top:14px; letter-spacing:-.01em;}
  .blurb{color:var(--ink-soft); font-size:1rem; line-height:1.55; max-width:62ch; margin-top:10px;}

  table.types{
    width:100%; border-collapse:collapse; margin-top:20px; font-size:.88rem;
    background:var(--paper-raised); box-shadow:var(--shadow); border-radius:12px; overflow:hidden;
  }
  table.types th{
    text-align:left; background:var(--navy); color:#fff; padding:10px 12px; font-weight:700;
    font-size:.78rem; letter-spacing:.02em;
  }
  table.types td{padding:9px 12px; border-top:1px solid var(--line); vertical-align:top;}
  table.types td.name{font-weight:700; white-space:nowrap;}
  table.types code{background:var(--code-bg); color:var(--code-accent); padding:1px 6px; border-radius:5px; font-size:.83em;}
  .table-wrap{overflow-x:auto; margin-top:10px;}
  .table-caption{
    margin-top:22px; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-soft);
  }

  /* ---- code cell ----
     The editor chrome (label bar, code area, actions) is always a light
     code-editor surface, independent of the page's own dark/light theme —
     the output console beneath it stays a dark terminal for contrast. */
  .cell{
    margin-top:22px; border-radius:12px; overflow:hidden;
    background:var(--editor-bg); box-shadow:var(--shadow); border:1px solid var(--editor-line);
  }
  .cell-label{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 14px; border-bottom:1px solid var(--editor-line);
    font-family:'JetBrains Mono',monospace; font-size:.74rem; letter-spacing:.03em;
    color:var(--editor-header-ink); background:var(--editor-header-bg);
  }
  .cell-body{padding:6px 4px;}
  .cell-body .CodeMirror{
    font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    font-size:.86rem; line-height:1.6; height:auto; background:transparent; color:var(--editor-ink);
    padding:8px 10px;
  }
  /* the library's own stylesheet sets height:100% on the scroller for its
     fixed-height mode; we always use viewportMargin:Infinity (grow to fit
     content, page scrolls instead), so that 100% has to be overridden or it
     resolves against the flex-laid-out <main> and blows the cell up to the
     full page height. */
  .cell-body .CodeMirror-scroll{height:auto!important; overflow:visible!important;}
  .cell-body .CodeMirror-gutters{display:none;}
  .cell-body .CodeMirror-lines{padding:0;}
  .cell-actions{
    display:flex; align-items:center; gap:10px; padding:10px 14px 14px;
    border-top:1px solid var(--editor-line);
  }
  button.run{
    all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    background:var(--code-accent); color:var(--code-accent-ink); font-weight:700; font-size:.82rem;
    padding:7px 16px; border-radius:100px; font-family:'Lato',sans-serif;
  }
  button.run:hover{filter:brightness(1.08);}
  button.run:disabled{opacity:.5; cursor:progress;}
  button.run .arrow{font-family:'JetBrains Mono',monospace;}
  .cell-hint{font-size:.76rem; color:var(--editor-header-ink);}
  pre.cell-output{
    margin:0; padding:11px 14px; font-size:.83rem; line-height:1.55; color:var(--code-ink);
    background:var(--code-bg); border-top:1px solid var(--code-line); white-space:pre-wrap; word-break:break-word;
    display:none; max-height:280px; overflow:auto;
  }
  pre.cell-output.show{display:block;}
  pre.cell-output.is-error{color:var(--err);}
  pre.cell-output.is-ok{color:var(--code-ink);}

  /* ---- challenge ---- */
  .challenge{
    margin-top:30px; border:1.5px dashed var(--accent-cyan); border-radius:16px;
    padding:18px 20px 20px; background:var(--paper-raised);
  }
  .challenge .tag{
    font-family:'JetBrains Mono',monospace; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase;
    color:var(--accent-cyan); font-weight:700;
  }
  .challenge p.prompt{margin:8px 0 0; font-size:.95rem; color:var(--ink); line-height:1.5;}
  .reveal{margin-top:12px;}
  .reveal summary{cursor:pointer; font-size:.8rem; color:var(--accent-cyan); font-weight:700; list-style:none;}
  .reveal summary::-webkit-details-marker{display:none;}
  .reveal summary::before{content:"▸ "; }
  .reveal[open] summary::before{content:"▾ ";}
  .reveal pre{
    margin-top:8px; background:var(--code-bg); color:var(--code-ink); padding:10px 12px;
    border-radius:8px; font-size:.82rem; white-space:pre-wrap; overflow-x:auto;
  }

  .topic-nav{display:flex; justify-content:space-between; gap:12px; margin-top:36px; padding-top:18px; border-top:1px solid var(--line);}
  .topic-nav button{
    all:unset; cursor:pointer; font-size:.85rem; color:var(--ink-soft); font-weight:600;
    padding:8px 4px; display:flex; align-items:center; gap:6px;
  }
  .topic-nav button:hover{color:var(--ink);}
  .topic-nav button:disabled{visibility:hidden;}

  ul.pointer-list{margin:16px 0 0; padding-left:1.15em; color:var(--ink-soft); line-height:1.7;}
  ul.pointer-list b{color:var(--ink); font-weight:600;}

  /* ---- responsive ---- */
  @media (max-width:820px){
    #shell2{flex-direction:column;}
    #nav{
      width:100%; border-right:none; border-bottom:1px solid var(--line);
      padding:12px 16px;
    }
    #nav ol{display:none;}
    #nav select{
      display:block; width:100%; padding:10px 14px; border-radius:100px; border:1px solid var(--line);
      background:var(--paper-raised); color:var(--ink); font-family:'Lato',sans-serif; font-size:.9rem;
    }
    main{padding:22px 16px 60px;}
    #topbar{padding-inline:16px;}
    section.topic h2{font-size:1.55rem;}
  }
</style>

    btn.addEventListener("click", () => showTopic(t.id));
    li.appendChild(btn);
    navList.appendChild(li);

    const opt = document.createElement("option");
    opt.value = t.id;
    opt.textContent = `${i+1}. ${t.title}`;
    navSelect.appendChild(opt);

    const section = document.createElement("section");
    section.className = "topic";
    section.id = "topic-" + t.id;

    let html = `<div class="eyebrow">Topic ${i+1} of ${TOPICS.length}</div><h2>${t.title}</h2><p class="blurb">${t.blurb}</p>`;

    (t.tables || (t.table ? [t.table] : [])).forEach(table => {
      if (table.caption) html += `<div class="table-caption">${table.caption}</div>`;
      html += `<div class="table-wrap"><table class="types"><thead><tr>${table.headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>`;
      table.rows.forEach(r => {
        html += `<tr><td class="name">${r[0]}</td><td><code>${r[1]}</code></td><td>${r[2]}</td></tr>`;
      });
      html += `</tbody></table></div>`;
    });

    if (t.pointers){
      html += `<ul class="pointer-list">` + t.pointers.map(p => `<li><b>${p[0]}</b> — ${p[1]}</li>`).join("") + `</ul>`;
    }

    section.innerHTML = html;

    (t.cells || []).forEach((cell, ci) => {
      section.appendChild(buildCell(t.id + "-cell-" + ci, cell.label, cell.code, t.id));
    });

    if (t.challenge){
      const ch = document.createElement("div");
      ch.className = "challenge";
      ch.innerHTML = `<div class="tag">Try it yourself</div><p class="prompt">${t.challenge.prompt}</p>`;
      ch.appendChild(buildCell(t.id + "-challenge", "your solution", t.challenge.starter, t.id, true));
      const rev = document.createElement("details");
      rev.className = "reveal";
      rev.innerHTML = `<summary>Reveal a solution</summary><pre>${escapeHtml(t.challenge.solution)}</pre>`;
      ch.appendChild(rev);
      section.appendChild(ch);
    }

    const nav = document.createElement("div");
    nav.className = "topic-nav";
    const prevBtn = document.createElement("button");
    prevBtn.textContent = "← previous";
    prevBtn.disabled = i === 0;
    prevBtn.addEventListener("click", () => showTopic(TOPICS[i-1].id));
    const nextBtn = document.createElement("button");
    nextBtn.textContent = "next →";
    nextBtn.disabled = i === TOPICS.length - 1;
    nextBtn.addEventListener("click", () => showTopic(TOPICS[i+1].id));
    nav.appendChild(prevBtn);
    nav.appendChild(nextBtn);
    section.appendChild(nav);

    mainEl.appendChild(section);
  });

  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function buildCell(id, label, code, topicId, isChallenge){
    const wrap = document.createElement("div");
    wrap.className = "cell";
    wrap.innerHTML = `
      <div class="cell-label"><span>${label}</span><span class="mono">python</span></div>
      <div class="cell-body"><textarea class="cell-input" id="${id}" spellcheck="false" rows="${Math.max(3, code.split("\n").length)}"></textarea></div>
      <div class="cell-actions">
        <button class="run" type="button" disabled><span class="arrow">▶</span> Run</button>
        <span class="cell-hint">${isChallenge ? "no wrong answers here — just run it" : ""}</span>
      </div>
      <pre class="cell-output"></pre>
    `;
    const ta = wrap.querySelector("textarea");
    ta.value = code;
    const runBtn = wrap.querySelector("button.run");
    const outEl = wrap.querySelector("pre.cell-output");
    // CodeMirror gives the cell real syntax highlighting on a light editor
    // surface; it replaces the textarea in the DOM but keeps it as the
    // underlying <form> element, so ta.value stays in sync automatically.
    const cm = window.CodeMirror.fromTextArea(ta, {
      mode: "python", theme: "default", lineNumbers: false, lineWrapping: true,
      viewportMargin: Infinity, indentUnit: 4, tabSize: 4, smartIndent: true,
      extraKeys: { Tab: (cm) => cm.replaceSelection("    ") }
    });
    (cmByTopic[topicId] || (cmByTopic[topicId] = [])).push(cm);
    runBtn.addEventListener("click", () => runCell(cm.getValue(), outEl, runBtn, topicId));
    return wrap;
  }

  function showTopic(id){
    document.querySelectorAll("section.topic").forEach(s => s.classList.toggle("active", s.id === "topic-" + id));
    document.querySelectorAll("#nav-list button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
    navSelect.value = id;
    mainEl.scrollTop = 0;
    (cmByTopic[id] || []).forEach(cm => cm.refresh());
    try { localStorage.setItem("py-workbook-last", id); } catch(e){}
  }
  navSelect.addEventListener("change", () => showTopic(navSelect.value));

  // ---------- progress (per-viewer convenience only) ----------
  function markDone(topicId){
    try {
      const done = JSON.parse(localStorage.getItem("py-workbook-done") || "{}");
      if (!done[topicId]){
        done[topicId] = true;
        localStorage.setItem("py-workbook-done", JSON.stringify(done));
      }
    } catch(e){}
    const btn = document.querySelector(`#nav-list button[data-id="${topicId}"]`);
    if (btn) btn.classList.add("done");
  }
  function restoreProgress(){
    try {
      const done = JSON.parse(localStorage.getItem("py-workbook-done") || "{}");
      Object.keys(done).forEach(id => {
        const btn = document.querySelector(`#nav-list button[data-id="${id}"]`);
        if (btn) btn.classList.add("done");
      });
    } catch(e){}
  }

  // ---------- brython runtime ----------
  let brythonReady = false;
  const statusPill = document.getElementById("status-pill");
  const statusText = document.getElementById("status-text");

  function boot(){
    // brython.min.js + brython_stdlib.min.js are already on the page by the
    // time this runs (loaded as plain <script> tags — no further network
    // fetches happen at runtime, everything the interpreter needs ships in
    // those two files).
    window.brython({ ids: [] }); // start the engine without running any text/python tags yet
    brythonReady = true;
    statusPill.classList.remove("loading");
    statusPill.classList.add("ready");
    statusText.textContent = "python ready";
    document.querySelectorAll("button.run").forEach(b => b.disabled = false);
  }

  function cleanTraceback(msg){
    // The wrapper script's own frames show up above the student's code —
    // keep only the last "<cell>" block onward, which is what actually
    // happened in the code the student wrote.
    const marker = 'File "<cell>"';
    const idx = msg.lastIndexOf(marker);
    if (idx === -1) return msg.trim();
    const lineStart = msg.lastIndexOf("\n", idx) + 1;
    return "Traceback (most recent call last):\n" + msg.slice(lineStart).trim();
  }

  async function runCell(code, outEl, runBtn, topicId){
    if (!brythonReady) return;
    runBtn.disabled = true;
    const prevLabel = runBtn.innerHTML;
    runBtn.innerHTML = `<span class="arrow">…</span> Running`;
    try {
      const raw = String(await runInBrython(code, topicId));
      const clean = /Traceback \(most recent call last\)|File "<cell>"/.test(raw) ? cleanTraceback(raw) : raw;
      const isError = clean.includes("Error") && /Traceback|File "<cell>"/.test(raw);
      outEl.className = "cell-output show " + (isError ? "is-error" : "is-ok");
      outEl.textContent = clean.length ? clean : "(ran with no output — try adding a print())";
      if (!isError) markDone(topicId);
    } catch (err) {
      outEl.className = "cell-output show is-error";
      outEl.textContent = String(err && err.message || err);
    } finally {
      runBtn.disabled = false;
      runBtn.innerHTML = prevLabel;
    }
  }

  // one shared, persistent namespace (a Python dict) per topic, stashed on
  // the `builtins` module so every wrapper script — each its own Brython
  // "module" — can reach the same dict across separate cell runs.
  function runInBrython(code, nsKey){
    return new Promise((resolve) => {
      const id = "cell_" + Date.now() + "_" + Math.random().toString(36).slice(2);
      // NB: the result key can't be `id` itself — an element with id="X" auto-
      // creates a same-named `window.X` (DOM named-access), which would shadow
      // the real value before Python ever runs. Use a distinct, prefixed key.
      const outKey = "out_" + id;
      const wrapper = [
        "import sys, traceback, builtins",
        "from browser import window",
        "class _Cap:",
        "    def __init__(self): self.buf = []",
        "    def write(self, s): self.buf.append(s)",
        "    def flush(self): pass",
        "_cap = _Cap()",
        "_orig_out, _orig_err = sys.stdout, sys.stderr",
        "sys.stdout = _cap; sys.stderr = _cap",
        "if not hasattr(builtins, '_workbook_ns'): builtins._workbook_ns = {}",
        "_ns = builtins._workbook_ns.setdefault(" + JSON.stringify(nsKey) + ", {})",
        "try:",
        "    exec(compile(" + JSON.stringify(code) + ", '<cell>', 'exec'), _ns)",
        "except Exception:",
        "    _cap.write(traceback.format_exc())",
        "sys.stdout, sys.stderr = _orig_out, _orig_err",
        "window." + outKey + " = ''.join(_cap.buf)"
      ].join("\n");
      const scriptEl = document.createElement("script");
      scriptEl.type = "text/python";
      scriptEl.id = id;
      scriptEl.textContent = wrapper;
      document.body.appendChild(scriptEl);
      window.brython({ ids: [id] });
      let tries = 0;
      const poll = () => {
        if (window[outKey] !== undefined) {
          const val = window[outKey];
          delete window[outKey];
          scriptEl.remove();
          resolve(val);
          return;
        }
        if (++tries > 250) { scriptEl.remove(); resolve("(timed out waiting for Python)"); return; }
        setTimeout(poll, 20);
      };
      poll();
    });
  }

  // ---------- init ----------
  restoreProgress();
  let startId = TOPICS[0].id;
  try {
    const last = localStorage.getItem("py-workbook-last");
    if (last && TOPICS.some(t => t.id === last)) startId = last;
  } catch(e){}
  showTopic(startId);
  boot();
})();
</script>

</body></html>
